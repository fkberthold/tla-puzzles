name: Build and deploy MkDocs site to GitHub Pages

# DEPLOY ONLY. The gate lives in verify-puzzles.yml, which runs scripts/cibuild
# on this same push to main and builds these docs again as its phase 4 (bead
# tla-1qn). Calling cibuild here too would put the 107-puzzle corpus in front of
# every deploy and buy no signal that the other workflow isn't already giving.
#
# A broken docs tree still can't reach the site. `mkdocs build` below fails the
# build job, and deploy needs it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: docs-requirements.txt
      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          pip install -r docs-requirements.txt
      - name: Build docs tree from puzzle READMEs
        run: bash scripts/build-docs.sh
      - name: Build site
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
