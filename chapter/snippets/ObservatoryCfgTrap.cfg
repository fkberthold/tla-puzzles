\* THE CFG TRAP.  The .cfg grammar accepts only bare identifiers.  You cannot
\* write `PROPERTY A!Spec`, and the error you get names `A`, which is not
\* where the problem is.
\* Run: ./run.sh Observatory.tla ObservatoryCfgTrap.cfg
\* Expected: rc=255, "Unknown operator: `A`."
CONSTANTS
    Proposals = {p1, p2}
    Dishes    = {d1, d2}
    Needed    = 2
    Idle      = Idle

SPECIFICATION
    Spec

PROPERTY
    A!Spec

CHECK_DEADLOCK
    FALSE
