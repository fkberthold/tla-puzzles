\* THE CFG TRAP.  The .cfg grammar accepts only bare identifiers.  You cannot
\* write `PROPERTY A!Spec`, and the error you get names `A`, which is not
\* where the problem is.
\* Run: ./run.sh Observatory.tla ObservatoryCfgTrap.cfg
\* Expected: rc=151, "The property A specified in the configuration file / is not
\* defined in the specification."  151 is the config-semantic verdict: the .cfg
\* parsed, and then named something the module does not define.  It is NOT 255,
\* which is TLC's catch-all for a missing or malformed .cfg.
CONSTANTS
    Proposals = {p1, p2}
    Dishes    = {d1, d2}
    Needed    = 2
    Idle      = Idle

SPECIFICATION
    Spec

PROPERTY
    A!Spec

CHECK_DEADLOCK
    FALSE
