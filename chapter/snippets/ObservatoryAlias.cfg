\* A refinement that really does fail, read through an ALIAS.
\* ArchivedEager counts a proposal as archived while it is still on sky, so a
\* Cloud step takes it back out of the abstract archive -- and the abstract
\* archive only grows.
\* Run: ./run.sh Observatory.tla ObservatoryAlias.cfg
\* Expected: rc=12, with `logged` printed in every row of the trace.
CONSTANTS
    Proposals = {p1, p2}
    Dishes    = {d1, d2}
    Needed    = 2
    Idle      = Idle

SPECIFICATION
    Spec

PROPERTY
    RefinesEager

ALIAS
    Alias

CHECK_DEADLOCK
    FALSE
