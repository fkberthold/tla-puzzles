\* section 8 in its transition relation. It HOLDS there, so this is the one
\* row in the probe family that must come back rc=0. run-probes.sh declares
\* an expectation of 12 for every row it carries, so running this one through
\* the same path and seeing DISAGREE is the evidence that the table's "yes"
\* column means something.
