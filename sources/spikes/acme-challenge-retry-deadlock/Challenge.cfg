\* RFC 8555 section 8, as published, against sections 8.2 and 7.1.6.
\* Expect a safety violation: the three sentences cannot all hold.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ErrorImpliesInvalid

\* Section 7.1.6 makes "valid" and "invalid" final states for a challenge
\* object, so a reachable state with no successor is intended here and a
\* deadlock report would be noise. 79 of 337 configs in the corpus survey do
\* the same.
CHECK_DEADLOCK FALSE

CONSTANTS
    Pending = Pending
    Processing = Processing
    Valid = Valid
    Invalid = Invalid
    MaxQueries = 2
    ClearOnSuccess = FALSE
