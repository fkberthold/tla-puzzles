\* Two doctors. Each doctor is a row and also the transaction that row's
\* owner runs, so Key and Txn are the same set.
CONSTANTS
  Key   = {"alice", "bob"}
  Txn   = {"alice", "bob"}
  Value = {"on", "off"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AtLeastOneOnCall

\* Every transaction reaching "done" is a terminal state on purpose.
CHECK_DEADLOCK FALSE
