\* CONSTANT assignments only.  Every other line of the generated .cfg belongs
\* to harness/seeded-bugs.sh, which refuses a directive here -- a matrix that
\* could write SYMMETRY, VIEW or a second INVARIANT could weaken its own
\* grading.
\*
\* Strict = TRUE because the reference is the CORRECT system: step completion
\* compares revisions.  One variant mutates that predicate away, which is the
\* defect argoproj/argo-cd#29410 reports.
\*
\* Deadlock checking is off by default in harness/verdict.sh, which is the
\* channel this matrix runs through, so the settled terminal state needs no
\* CHECK_DEADLOCK line -- and could not carry one here if it did.
CONSTANTS
    NumApps = 3
    MaxRev  = 1
    Strict  = TRUE
