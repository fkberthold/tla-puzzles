\* Constants only.  The probe invariant is injected on the command line with
\* `tlc -inv <Name>`, which V2-PLAN.md section 5.3 records as the form that
\* works -- `INVARIANT FALSE` written into a .cfg is constant-folded and
\* rejected at rc=151 instead.  No INVARIANT line here, so a probe run checks
\* exactly the one operator it names.
SPECIFICATION Spec

CONSTANTS
    NumApps = 3
    MaxRev  = 1
    Strict  = FALSE

CHECK_DEADLOCK FALSE
