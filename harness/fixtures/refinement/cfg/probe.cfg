\* Row 3 of the disjointness matrix: the probe, checked alone, as an ORDINARY
\* INVARIANT. Violated (rc=12) when the mapping moves, satisfied (rc=0) when
\* it is frozen.
\*
\* A PASSING PROBE IS A FAILING REFINEMENT CHECK.
\*
\* Names the module's own `Probe` because a .cfg accepts only bare
\* identifiers. refinement.sh does NOT do this -- it generates its own probe
\* operator, because a module-supplied one is forgeable (forged-probe/).
