\* A legal constants fragment that actually declares something.
\*
\* Used to prove the splice: run refinement.sh with --keep and this fragment,
\* and the CONSTANT line has to appear in BOTH generated .cfgs. A comment-only
\* fragment could not demonstrate that.
\*
\* It has to be proved by reading the artifact rather than by reading an exit
\* code, because there is no exit code to read. `Limit` is declared by no
\* fixture spec, and TLC does not mind in the slightest: measured on TLC
\* 2026.03.04.183147, rc=0 and "Model checking completed. No error has been
\* found", with no warning even when -nowarning is dropped.
\*
\* That silence is the §5.3 hazard family again -- the .cfg accepting a line it
\* then never acts on. An INVARIANT or PROPERTY naming something the spec lacks
\* is a hard 151; a CONSTANT naming something the spec lacks is nothing at all.
CONSTANT Limit = 6
