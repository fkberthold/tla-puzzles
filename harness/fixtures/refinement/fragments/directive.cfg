\* A checking directive smuggled into the constants fragment. Refused.
\*
\* The fragment is the only caller-supplied text that reaches the generated
\* .cfg, so it is the only route by which a problem could author part of its
\* own oracle configuration. TLAiBench lets the subject under evaluation
\* write the whole .cfg, and that is HOW its frozen-mapping trapdoor stays
\* open (tla-kl5.3 survey, section 7). The fragment therefore carries data
\* -- CONSTANT assignments -- and never directives.
\*
\* This one replaces the refinement property with something trivially true,
\* which would pass every run the harness makes.
CONSTANT Limit = 6
PROPERTY TRUE
