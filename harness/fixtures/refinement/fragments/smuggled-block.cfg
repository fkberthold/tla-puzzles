\*
\* A `(* ... *)` block comment is a comment to TLC and is not a comment to an
\* anchored `^SYMMETRY` match, so the keyword after it starts the line as far
\* as the guard can see and does not start the line as far as grep can see.
\* Measured: `(* c *) INVARIANT Bad` checks Bad and exits 12.
\*
\* Getting this one wrong is worse than mislabelling a verdict. Specifying
\* Systems p.244/246 says symmetry reduction on a temporal property may miss
\* errors or report one that isn't there, and the run still exits 0. There is
\* no verdict afterwards that would tell you the answer was wrong.
