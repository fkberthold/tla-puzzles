\* SYMMETRY on a refinement problem. Refused.
\*
\* Specifying Systems p.244/246: symmetry reduction may "miss errors, report
\* an error that doesn't exist, or report a real error with an incorrect
\* counterexample" when a temporal property is checked. Refinement IS a
\* temporal property -- an implied-init plus an implied-action -- so every
\* refinement run is exactly the case the caveat covers.
\*
\* Note the failure mode this refusal defends against is UNSOUNDNESS, not
\* noise: the run still exits 0. There is no verdict to read that would tell
\* you the answer was wrong, which is why the refusal has to be static.
CONSTANT Perms = Permutations(Colours)
SYMMETRY Perms
