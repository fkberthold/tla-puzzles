\* An author who wanted to bound their own reference and reached for the one
\* channel a problem package has into a generated .cfg. There is nothing
\* adversarial here -- TypeOK is the most ordinary operator name in TLA+, and
\* the author expects it to name THEIR OWN operator.
\*
\* Two things make it a fixture rather than a mistake anyone would spot.
\*
\* The judge module EXTENDS the SUBMISSION's spec, so `TypeOK` resolves to
\* whatever the submission called TypeOK, and every submission that defines
\* one gets it checked as a second invariant it never agreed to.
\*
\* And it rides a BLOCK COMMENT. TLC's .cfg parser is token-oriented: only
\* `\*` makes the rest of a line a comment, so `(* pad *) INVARIANT TypeOK`
\* is a live INVARIANT directive to TLC and invisible to a guard anchored at
\* the start of a line. That is the hole bead tla-nesz closed in
\* refinement.sh, arriving here by the same route.
(* pad *) INVARIANT TypeOK
