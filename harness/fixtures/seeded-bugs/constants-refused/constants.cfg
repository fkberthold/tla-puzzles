\* A constants fragment that is NOT a constants fragment. Bead tla-40y.
\*
\* Two refused directives, on purpose, so one fixture exercises both classes:
\*
\*   SYMMETRY  -- the soundness one. Symmetry reduction is sound only for a
\*                property that is itself symmetric, and the submitted
\*                property is not the author's to vouch for. A missed
\*                violation on a variant surfaces as rc=0 where 12 was
\*                required, and the matrix bills PROPERTY_TOO_WEAK to the
\*                learner for the author's config.
\*
\*   INVARIANT -- the ownership one. seeded-bugs.sh generates the INVARIANT
\*                line itself; a second one checked alongside it decides the
\*                verdict without appearing anywhere in the report.
\*
\* Do not "repair" this file. It is wrong on purpose, the way
\* variants-inert/inert-guard and properties/Unsound.tla are.
CONSTANTS
  Accounts = {"a1"}
  MaxBalance = 1
SYMMETRY Perms
INVARIANT SneakyInv
