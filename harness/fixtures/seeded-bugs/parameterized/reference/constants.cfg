\* Constant assignments for the parameterised matrix (bead tla-40y).
\*
\* seeded-bugs.sh finds this file beside the reference module and appends it
\* to EVERY .cfg it generates -- the oracle runs and the submission runs, the
\* reference runs and the variant runs alike. A variant inherits it because a
\* variant is the reference module mutated, not a different module.
\*
\* CONSTANT / CONSTANTS assignments only. A directive here -- INVARIANT,
\* SPECIFICATION, ALIAS, SYMMETRY -- is refused as MATRIX_MALFORMED; see the
\* header of harness/seeded-bugs.sh for why. This line proves comments are
\* stripped before that check runs: it says INVARIANT and SYMMETRY and the
\* matrix still runs.
CONSTANTS
  Accounts = {"a1", "a2"}
  MaxBalance = 2
