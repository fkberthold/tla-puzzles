# Read by probe.sh. KEY=value lines and # comments only, parsed rather than
# sourced. Each key maps onto one harness/refinement.sh option.
#
# ABSTRACT_INIT is TCInit rather than the grader's default of Init, because
# TCommit names its initial predicate TCInit. The grader's frozen-mapping
# probe is <instance>!<abstract-init>, so getting this wrong would assert the
# wrong predicate and report FROZEN_MAPPING on a mapping that moves fine.
MODULE=TwoPhaseCommit.tla
ORACLE=TCommit.tla
REFINES=Refines
ABSTRACT_INIT=TCInit
CONSTANTS=constants.cfg
TIMEOUT=120
