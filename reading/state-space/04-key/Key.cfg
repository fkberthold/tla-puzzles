SPECIFICATION ISpec

CONSTANT Staff = {s1, s2, s3}

INVARIANT TypeOK
INVARIANT MutEx
INVARIANT Hooked

\* ISpec is not Spec, and the difference is the first conjunct. Spec starts
\* from Init. ISpec starts from Inv, so TLC begins the run in every state
\* the invariant admits and takes one step from each of them. That asks
\* whether Inv is inductive, which is a different question from whether it
\* holds everywhere Spec can reach.

\* Deadlock checking is off because ISpec's initial states are not the
\* storeroom's. Weaken Inv and some of the states it admits have no
\* successor at all, and an 11 over one of those says nothing about the
\* storeroom.
CHECK_DEADLOCK FALSE
