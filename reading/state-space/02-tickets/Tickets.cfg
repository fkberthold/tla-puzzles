SPECIFICATION Spec

CONSTANTS
  Player = {a, b, c}
  Nil = Nil
  Limit = 6

INVARIANT TypeOK
INVARIANT Issued
INVARIANT NoSkip
INVARIANT Distinct
INVARIANT MutualExclusion

PROPERTY Orderly

\* next grows by one on every Take and nothing ever lowers it, so the
\* reachable state space is infinite. This line is what makes the run
\* finish, and rc 0 then means no violation among the behaviours that
\* stay inside the bound.
CONSTRAINT Bounded

\* Deadlock checking is on. At next = Limit the only move left is a
\* Take and the constraint prunes it, so the state has no successor in
\* the graph, and TLC still reports no deadlock. A constraint boundary
\* is not a wedged machine.
CHECK_DEADLOCK TRUE
