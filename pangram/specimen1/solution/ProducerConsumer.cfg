\* Tiny model so TLC terminates fast: 2 producers, 2 consumers, capacity 2.
CONSTANTS
  Producers = {"p1", "p2"}
  Consumers = {"c1", "c2"}
  BufCapacity = 2
  Items = {2}

SPECIFICATION Spec

INVARIANT Inv

PROPERTY AlwaysBounded
PROPERTY EventuallyDone
PROPERTY ItemsDrain
PROPERTY Progress
PROPERTY Stabilizes
