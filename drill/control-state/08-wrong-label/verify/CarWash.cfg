\* The invariant order matters, and every config in this directory keeps it:
\* TLC reports the first listed invariant that fails in the first state
\* that fails any, and the prompt's trace was taken with this order.
SPECIFICATION Spec
INVARIANTS OneInTheBay PaidFor
CONSTANTS
  Customers = {c1, c2}
  Arrived = Arrived
  Paid = Paid
  Washing = Washing
  Gone = Gone
  Free = Free
  Busy = Busy
