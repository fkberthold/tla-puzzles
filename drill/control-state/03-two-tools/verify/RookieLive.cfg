\* Deadlock checking off, but a liveness property with fairness asks the
\* same question the long way round.
SPECIFICATION FairSpec
INVARIANT BothInHand
PROPERTY DayEnds
CHECK_DEADLOCK FALSE
CONSTANTS
  Techs = {a, b}
  Rookie = b
  Nobody = Nobody
  Ladder = Ladder
  Meter = Meter
  Idle = Idle
  HasLadder = HasLadder
  HasMeter = HasMeter
  HasBoth = HasBoth
  Done = Done
